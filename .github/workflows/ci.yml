name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check
        run: ./tools/odinw check
      - name: Test
        run: ./tools/odinw test -define:ODIN_TEST_FANCY=false
      - name: RakNet differential fixtures
        run: ./tests/differential/raknet-messages.sh
      - name: RakNet cross-runtime echo
        run: ./tests/differential/raknet-cross-runtime.sh
      - name: RakNet throughput comparison
        run: ./tests/benchmarks/raknet-compare.sh
